[project]
name = "seitt"
version = "0.1.0"
description = "SE-ITT — Sistema Experto Hibrido basado en Logica Difusa para ITT en Bancos de Sangre (PFG, UCP)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
# La capa de presentacion es OPCIONAL a proposito: el nucleo simbolico
# (spec + seitt_core) se instala y corre sin ella -- Eval Harness, tests y
# uso como biblioteca no necesitan levantar un servidor. Mismo criterio que
# se aplico a tkinter en la GUI legada. Un contenedor headless que solo
# valide la spec no arrastra FastAPI (Consigna 4).
api = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]
# httpx es dependencia de TEST, no de runtime: la necesita el TestClient de
# Starlette en tests/test_api.py.
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "spec",
    "seitt_core",
    "seitt_core.adapters",
    "seitt_core.eval",
    "seitt_core.ports",
    "app",
    "app.api",
]
# REVISION Consigna 4 (Dockerizacion). Hasta esta version, esta lista
# omitia seitt_core.adapters, seitt_core.ports y seitt_core.eval, y NO
# declaraba package-data: la nota anterior asumia que bastaba con el
# modo editable, donde el finder mapea los paquetes de vuelta al arbol
# fuente y por lo tanto Path(__file__) siempre cae dentro del repo.
#
# Esa asuncion se verifico empiricamente y es FALSA para una wheel real:
# `pip install .` producia una instalacion que no podia emitir un solo
# veredicto (faltaba kb_rules.json, la KB misma) y en la que
# `import app.api.main` fallaba por los subpaquetes ausentes. La
# instalacion editable enmascaraba el defecto, que es de DECLARACION de
# artefacto distribuible, no de resolucion de rutas.
#
# La correccion es enteramente declarativa: no se toco una linea de
# seitt_core/. Las rutas cruzadas (seitt_core/../spec/schemas/) siguen
# resolviendo porque las wheels se instalan como directorios reales y
# spec/ y seitt_core/ quedan hermanos en site-packages igual que en el
# repo. Por eso NO se introdujo importlib.resources.
include-package-data = false

[tool.setuptools.package-data]
# Recursos leidos en runtime. Se enumeran uno por uno en vez de activar
# include-package-data: el contenido de la wheel queda determinado por
# este archivo y solo por este archivo, sin depender de MANIFEST.in ni de
# que archivos esten versionados. Es un requisito de la Consigna 4 —
# dos builds del mismo commit deben producir el mismo artefacto.
spec = [
    "schemas/*.json",   # 8 JSON Schema Draft 2020-12; rule.schema.json lo
                        # lee RuleEngine.load() en cada arranque, y
                        # eval_case.schema.json el Eval Harness.
    "rules/*.json",     # KB normativa (fuente); seitt_core/rules/ es la copia.
]
seitt_core = ["rules/*.json"]
# Solo el dataset de ground truth. eval_report.json queda deliberadamente
# afuera: es una SALIDA del arnes (gitignorada), no una entrada, y
# empaquetar el resultado de una corrida dentro del artefacto que se va a
# evaluar invita a confundir evidencia con insumo.
"seitt_core.eval" = ["eval_dataset.json"]
# Frontend estatico. Sin paso de build: los archivos se sirven tal cual.
# El glob recursivo cubre subdirectorios futuros (assets/, img/) sin
# requerir otra revision de empaquetado.
app = ["web/*", "web/**/*"]
