[project]
name = "seitt"
version = "0.1.0"
description = "SE-ITT — Sistema Experto Hibrido basado en Logica Difusa para ITT en Bancos de Sangre (PFG, UCP)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
# La capa de presentacion es OPCIONAL a proposito: el nucleo simbolico
# (spec + seitt_core) se instala y corre sin ella -- Eval Harness, tests y
# uso como biblioteca no necesitan levantar un servidor. Mismo criterio que
# se aplico a tkinter en la GUI legada. Un contenedor headless que solo
# valide la spec no arrastra FastAPI (Consigna 4).
api = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]
# httpx es dependencia de TEST, no de runtime: la necesita el TestClient de
# Starlette en tests/test_api.py.
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["spec", "seitt_core", "app", "app.api"]
# Solo se empaquetan los modulos Python de spec/ y seitt_core/ (imports en
# modo editable, ver "pip install -e ." en CLAUDE.md). Explicitamente NO
# se declara package_data ni se activa include-package-data: los JSON
# Schema (spec/schemas/), la KB (spec/rules/, seitt_core/rules/), los
# datasets (seitt_core/eval/) y domain_model.md son artefactos de
# especificacion / datos de runtime que el codigo lee via rutas relativas
# a Path(__file__) (ver SCHEMAS_DIR en validate_spec.py, _DEFAULT_RULES_PATH
# en rule_engine.py) — nunca via importlib.resources sobre el paquete
# instalado. En modo editable esto funciona porque el arbol fuente no se
# mueve; si en el futuro (Consigna 4, Docker) se construye una wheel real
# para distribucion, esta lista de exclusion debe revisarse a proposito,
# no heredarse por default de setuptools.
include-package-data = false
